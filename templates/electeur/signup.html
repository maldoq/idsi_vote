{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription IDSI Vote</title>
    <link rel="stylesheet" href="{% static 'css/electeur/signup.css' %}">
</head>
<body>
    <div class="content">
        <h1>Inscription</h1>

        <form method="post">
            {% csrf_token %}

            {% if messages %}
            <div class="error_message">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4"/>
                    <path d="M12 8h.01"/>
                </svg>
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <div class="inputs">
                <input type="text" name="nom" placeholder="Entrez votre nom" required>
                <input type="text" name="prenoms" placeholder="Entrez votre prénom" required>
            </div>

            <div class="inputs">
                <select name="genre" required>
                    <option value="">-- Sélectionner un genre --</option>
                    <option value="Homme">Homme</option>
                    <option value="Femme">Femme</option>
                </select>
                <input type="date" name="date_naiss" required>
            </div>

            <div class="inputs">
                <input type="tel" name="telephone" placeholder="Entrez votre numéro de téléphone" required>
                <input type="email" name="emailInst" placeholder="Entrez votre email institutionnel" required>
            </div>

            <div class="inputs">
                <input type="password" name="password1" placeholder="Entrez votre mot de passe" required>
                <input type="password" name="password2" placeholder="Confirmez votre mot de passe" required>
            </div>

            <button type="submit">S'inscrire</button>
        </form>

        <div class="ecoles">
            <img src="{% static 'assets/img/inphb.png' %}" alt="INPHB">
            <img src="{% static 'assets/img/x-poly.png' %}" alt="X-Polytech">
            <img src="{% static 'assets/img/Ensea-logo.png' %}" alt="ENSEA">
        </div>
    </div>
</body>
</html>
